[include mainsail.cfg]
# X-Plus3 config created by Phil1988(github)/coco.33(discord) on 20.12.2024
# For more information check out my wiki: https://github.com/Phil1988/FreeDi/wiki


#####################################################################
# Kinematics
#####################################################################
[printer]
kinematics:corexy
max_velocity: 600
max_accel: 5000
max_z_velocity: 20
max_z_accel: 500
square_corner_velocity: 8


#####################################################################
# Motherboard and periphery
#####################################################################
# Mainboard (RK3328) host temperature sensor
[temperature_sensor Mainboard_RK3328]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

# Main MCU (STM32F402) connection
[mcu]
serial: /dev/ttyS0
restart_method: command
baud: 500000

# Mainboard MCU temperature sensor
[temperature_sensor Mainboard_STM32F402]
sensor_type: temperature_mcu
sensor_mcu: mcu

# Toolhead MCU (RP2040) connection
[mcu Toolhead]
serial: /dev/serial/by-id/usb-Klipper_rp2040_C5A47A1652AC4A53-if00

# Toolhead MCU temperature sensor
[temperature_sensor Toolhead_STM32F103XE]
sensor_type: temperature_mcu
sensor_mcu: Toolhead
min_temp: 0
max_temp: 100

#####################################################################
# Features
#####################################################################
# For saving GCODE files
[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

# For enabling pause/resume
[pause_resume]

# Activating exclude objects feature
[display_status]
[exclude_object]

# Expanding idle timeout
[idle_timeout]
timeout: 5400   ; 90min timeout

# Activating GCODE arc feature
[gcode_arcs]
resolution: 1.0

# Allowing free move (can be dangerous!)
[force_move]
enable_force_move: True

# Activating responses
[respond]
default_type: echo

#####################################################################
# FreeDi
#####################################################################
[include freedi.cfg] 

#####################################################################
# Macros
#####################################################################
[include macros/*.cfg]
[include macros/*/*.cfg]
[include macros/*/*/*.cfg]

#####################################################################
# Klipper Extras
#####################################################################
[include addons/klippain_shaketune.cfg]

#####################################################################
# Input shaping
#####################################################################
# Resonance testing configuration (sets accelerometer and test points)
[resonance_tester]
accel_chip: beacon
probe_points: 140, 140, 20

# Toolhead-mounted ADXL345
# [adxl345]
# cs_pin: Toolhead:gpio13
# spi_software_sclk_pin: Toolhead:gpio14
# spi_software_mosi_pin: Toolhead:gpio15
# spi_software_miso_pin: Toolhead:gpio12
# axes_map: x, z, -y

# Input shaper parameters from calibration
[input_shaper]
shaper_type_x: 3hump_ei
shaper_freq_x: 91.4
shaper_type_y: 3hump_ei
shaper_freq_y: 86.6


#####################################################################
# Hotend
#####################################################################
[extruder]
step_pin: Toolhead:gpio5
dir_pin: Toolhead:gpio4
enable_pin: !Toolhead:gpio10
rotation_distance: 53.5
gear_ratio: 1628:170				
microsteps: 16
full_steps_per_rotation: 200
nozzle_diameter: 0.400
filament_diameter: 1.75
min_temp: 0
max_temp: 360
min_extrude_temp: 170
smooth_time: 0.000001
step_pulse_duration: 0.000002

heater_pin: Toolhead:gpio0
sensor_type: MAX6675
sensor_pin: Toolhead:gpio17
max_power: 1.0
#control: pid  
#pid_Kp: 24.687
#pid_Ki: 10.994
#pid_Kd: 13.995

spi_speed: 100000
spi_software_sclk_pin: Toolhead:gpio18
spi_software_mosi_pin: Toolhead:gpio19
spi_software_miso_pin: Toolhead:gpio16

pressure_advance: 0.035
pressure_advance_smooth_time: 0.03
max_extrude_cross_section:500
instantaneous_corner_velocity: 10.000
max_extrude_only_distance: 500.0
max_extrude_only_velocity: 5000
max_extrude_only_accel: 2000

[verify_heater extruder]
max_error: 120
check_gain_time: 20
hysteresis: 5
heating_gain: 1


#####################################################################
# Heated bed
#####################################################################
[heater_bed]
heater_pin: PC8
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PA0
max_power: 1.0
#control: pid
#pid_kp: 64.431
#pid_ki: 2.845
#pid_kd: 364.839
min_temp: -50
max_temp: 125
pwm_cycle_time: 0.02 # for 50Hz line power 
#pwm_cycle_time: 0.016 # for 60Hz line power

[verify_heater heater_bed]
max_error: 200
check_gain_time: 360
hysteresis: 5
heating_gain: 1


#####################################################################
# Bed mesh
#####################################################################
[bed_mesh]
zero_reference_position: 140, 140
speed: 200               
horizontal_move_z: 5.0
mesh_min: 54,25
mesh_max: 250,235   
probe_count: 7,7
adaptive_margin: 0
algorithm: bicubic
bicubic_tension: 0.2
split_delta_z: .025
move_check_distance: 5.0
mesh_pps: 2, 2
fade_start: 4.0
fade_end: 8.0


#####################################################################
# Probe - Universal Stock Probe
# Enable exactly one probe section: [probe], [beacon], or [bltouch].
#####################################################################
#!# Pay attention to this section and compare it with your stock backup config
# [probe]
# pin: ^!Toolhead:gpio21
# x_offset: 28
# y_offset: 4.4
# z_offset: 1.549             #!# change this to 0 if you get a "Probe triggered prior to movement" - Error
# speed: 5
# samples: 2
# samples_result: average
# sample_retract_dist: 1.1
# samples_tolerance: 0.08
# samples_tolerance_retries: 3

#####################################################################
# Beacon RevH Probe
# Comment out [beacon] before enabling either [probe] or [bltouch].
#####################################################################
[beacon]
serial: /dev/serial/by-id/usb-Beacon_Beacon_RevH_FF572D5F4E5737374D202020FF082040-if00   # USB device path; replace YOURBEACONID with the ID reported for this Beacon.
home_xy_position: 134.5, 128                                         # Center of the configured X-Plus3 travel: X (-11 to 280), Y (-24 to 280).
home_z_hop: 5                                                        # Z distance lifted before XY homing moves, helping prevent nozzle or bed contact.
home_z_hop_speed: 30                                                 # Speed of the protective Z lift before XY homing.
home_xy_move_speed: 200                                              # Speed used to move to home_xy_position for Beacon Z homing.
mesh_main_direction: x                                               # Primary travel direction during bed mesh scanning; choose the direction with the best clearance.
mesh_runs: 2                                                         # Number of mesh passes; increase for repeatability checks at the cost of time.
speed: 2                                                             # Z dive speed while taking a Beacon probe measurement.
lift_speed: 3                                                        # Z lift speed between Beacon measurements.
x_offset: 0                                                          # X distance from the nozzle to the Beacon sensor; affects probe location calculations.
y_offset: 24                                                         # Y distance from the nozzle to the Beacon sensor; affects probe location calculations.
accel_axes_map: -x, -y, z                                            # Remaps or inverts Beacon accelerometer axes to match the printer axes for input shaping.
contact_max_hotend_temperature: 280                                  # Maximum hotend temperature allowed for contact probing; raise only when the surface and hardware permit it.
default_model_name: default                                          # Beacon model loaded for proximity probing after calibration.
home_method: contact                                               # Default G28 probing method; proximity or contact.
home_method_when_homed: proximity                                    # Method for later homing cycles; proximity is faster and non-contact.
home_autocalibrate: unhomed                                          # Autocalibrate during initial homing when needed.
backlash_comp: 0.02256              								 # Optional compensation for Z backlash; enable only if backlash is present.

# BLTouch - Early X-series variant.
# Uncomment [bltouch] only if your machine has a BLTouch, and comment out [beacon].
# Compare these pins and offsets with the stock backup configuration before enabling it.
# [bltouch]
#sensor_pin: ^Toolhead:gpio21
#control_pin: Toolhead:gpio11
#stow_on_each_sample: False
#x_offset: 28
#y_offset: 4.4
#z_offset: 0.0
#speed: 5
#samples: 2
#samples_result: average
#sample_retract_dist: 3.0
#samples_tolerance: 0.08
#samples_tolerance_retries:3


#####################################################################
# Heated chamber
#####################################################################
[heater_generic chamber]
heater_pin: PB10
max_power: 1.0
sensor_type:NTC 100K MGB18-104F39050L32
sensor_pin: PA1
control: watermark
max_delta: 0.5
min_temp:-100
max_temp: 70

[verify_heater chamber]
max_error: 300
check_gain_time: 900
hysteresis: 5
heating_gain: 1


########################################
# Filament runout sensor
# Amended for BTT SFS v2.0
########################################
[delayed_gcode INIT_FILAMENT_SENSORS] # Disable the BTT SFS v2.0 sensors on initial startup - invoke them inside your macros.cfg workflow.
initial_duration: 1.0
gcode:
    SET_FILAMENT_SENSOR SENSOR=filament ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    
[filament_switch_sensor filament]
pause_on_runout: True
runout_gcode:
  PAUSE
  # SET_FILAMENT_SENSOR SENSOR=fila ENABLE=1
  M117 Filament has runout! Check/Replace Spool...
insert_gcode:
  M117 Filament is detected!
event_delay: 30.0
pause_delay: 0.5
switch_pin: PC3                 # default setting !PC1

## BTT SFS V2.0 encoder sensor
[filament_motion_sensor encoder_sensor]
switch_pin: PC1
detection_length: 3.88
extruder: extruder
pause_on_runout: True
runout_gcode:
  PAUSE
  M117 Filament feed appears to have stopped! Check Spool/Extruder...
insert_gcode:
  M117 Filament feed is OK!


#####################################################################
# Fans
#####################################################################
# Part cooler fan 
[fan]
pin: Toolhead:gpio2
max_power: 1.0
cycle_time: 0.0100
hardware_pwm: false
kick_start_time: 0.200
off_below: 0.08
shutdown_speed: 0

## Big side radial turbo fan
[fan_generic sidefan]
pin: PA8
max_power: 1.0
cycle_time: 0.0100
hardware_pwm: false
kick_start_time: 0.250
off_below: 0.3
shutdown_speed: 0

## Activated charcoal blowing fan
[fan_generic filterfan]
pin: PC9
max_power: 1.0
cycle_time: 0.0100
hardware_pwm: false
kick_start_time: 0.200
off_below: 0.3
shutdown_speed: 0

# Hotend Coldside Fan
[heater_fan hotend_fan]
pin: Toolhead:gpio1
max_power: 1.0
shutdown_speed:1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 60.0
fan_speed: 1.0
off_below: 0

#!# Delete the next section if your stock backup config doesnt have it
# Toolboard Fan
[heater_fan hotend_fan2]
pin: Toolhead:gpio20
max_power: 1.0
shutdown_speed:1.0
kick_start_time: 0.5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
off_below: 0

#!# Delete the next section if your stock backup config doesnt have it
## Controllable Mainboard cooling fan
[temperature_fan Mainboard_fan]
sensor_type: temperature_host 
pin: PC4        
max_power: 1.0  
cycle_time: 0.01
sensor_type: temperature_combined
sensor_list: temperature_sensor Mainboard_RK3328, temperature_sensor Mainboard_STM32F402
combination_method: max                                           # use the maximum reading of the sensors
maximum_deviation: 999.9                                          # we don't care about the difference in temperature
shutdown_speed: 0.0
kick_start_time: 0.4
off_below: 0.19
min_temp: 0
max_temp: 85.0  
target_temp: 42.0
min_speed: 0
max_speed: 1.0
control: pid
pid_deriv_time: 2.0
pid_Kp: 2.0
pid_Ki: 5.0
pid_Kd: 0.5


#####################################################################
# Light
#####################################################################
## caselight LEDs
[output_pin caselight]
pin: PC7
pwm: true
cycle_time: 0.0100
shutdown_value:0
value:1


#####################################################################
# Buzzer
#####################################################################
## Buzzer
[output_pin buzzer]
pin: PA2
pwm: false
shutdown_value:0
value:0

[output_pin sound]
pin: PA13
value:0


#####################################################################
# Power outage shutdown
#####################################################################
[output_pin pwc]
pin: PA3
pwm: False
value: 1
shutdown_value: 1


#####################################################################
# Drives
#####################################################################
[stepper_x]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB5
microsteps: 32
rotation_distance: 39.94
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_x:virtual_endstop
position_min: -11
position_endstop: -11
position_max: 280
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: False
step_pulse_duration: 0.000002

[stepper_y]
step_pin: PC14
dir_pin: PC13
enable_pin: !PC15
microsteps: 32
rotation_distance: 39.96
full_steps_per_rotation: 200
endstop_pin: tmc2209_stepper_y:virtual_endstop
position_min: -24
position_endstop: -24
position_max: 280
homing_speed: 50
homing_retract_dist: 0
homing_positive_dir: False
step_pulse_duration: 0.000002

[stepper_z]
step_pin: PC10
dir_pin: PA15
enable_pin: !PC11
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200
endstop_pin: probe:z_virtual_endstop #!PC3
position_max: 280
position_min: -12
homing_speed: 10
homing_retract_dist: 0
second_homing_speed: 5
homing_positive_dir: false
step_pulse_duration: 0.000002


#####################################################################
# Steppers configuration
#####################################################################
[tmc2209 extruder]
uart_pin: Toolhead:gpio6
interpolate: False
run_current: 0.714              #!# Pay attention to this value and compare it with your stock backup config
stealthchop_threshold: 0
sense_resistor: 0.110           #The resistance (in ohms) of the driver sense resistor. Common values are 0.110 ohms for most TMC2209 drivers


[tmc2209 stepper_x]
uart_pin: PD2
run_current: 1.07               #!# Pay attention to this value and compare it with your stock backup config
interpolate: False
stealthchop_threshold: 0
diag_pin: ^PB8
driver_SGTHRS: 85
sense_resistor: 0.110

[tmc2209 stepper_y]
uart_pin: PB9
run_current: 1.07              #!# Pay attention to this value and compare it with your stock backup config
interpolate: False
stealthchop_threshold: 0
diag_pin: ^PC0
driver_SGTHRS: 85
sense_resistor: 0.110

[tmc2209 stepper_z]
uart_pin: PC5
run_current: 0.285             #!# Pay attention to this value and compare it with your stock backup config
interpolate: False
stealthchop_threshold: 99999
sense_resistor: 0.110

#####################################################################
# Screws tilt adjust
#####################################################################
[screws_tilt_adjust] 
horizontal_move_z: 5
screw_thread: CCW-M4
speed: 200
screw1: 50, 10
screw1_name: front left screw
screw2: 220, 10
screw2_name: front right screw
screw3: 220, 200
screw3_name: rear right screw
screw4: 50, 200
screw4_name: rear left screw


#####################################################################
# Axis twist compensation
#####################################################################
[axis_twist_compensation]
calibrate_start_x: 10
calibrate_end_x: 260
calibrate_y: 140


#####################################################################
# Skew Correction
#####################################################################
[skew_correction]


