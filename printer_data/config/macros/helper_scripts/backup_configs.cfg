[gcode_macro BACKUP_CONFIGS]
description: Backup Klipper configuration files to remote Git repository.
  Usage: BACKUP_CONFIGS [MESSAGE="Commit message"]
  If no message is provided, a default auto-generated commit message will be used.
  The backup process runs with a 90-second timeout and shows verbose output.
gcode:
    {% set message = params.MESSAGE|default() %}
    {% if message %}
        RUN_SHELL_COMMAND CMD=update_git_script_message PARAMS="'{params.MESSAGE}'"
    {% else %}
        RUN_SHELL_COMMAND CMD=update_git_script
    {% endif %}

[gcode_shell_command update_git_script]
command: bash -c "bash $HOME/klipper-backup/script.sh"
timeout: 90.0
verbose: True

[gcode_shell_command update_git_script_message]
command: bash -c "bash $HOME/klipper-backup/script.sh -c \"$0\""
timeout: 90.0
verbose: True