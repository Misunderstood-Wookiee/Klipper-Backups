# Ultra Quiet Mode
[gcode_macro ULTRA_QUITE_MODE]
description: Set ultra quiet mode speed and enable/disable ultra quiet mode, restoring previous speed when disabled.
variable_active: 0
variable_prev: 100
gcode:
    {% if active %}
        M220 S{prev}
        M118 Ultra Quiet Mode: DISABLED
    {% else %}
        SET_GCODE_VARIABLE MACRO=ULTRA_QUITE_MODE VARIABLE=prev VALUE={(printer.gcode_move.speed_factor * 100)|int}
        M220 S30
        M118 Ultra Quiet Mode: ENABLED
    {% endif %}
    SET_GCODE_VARIABLE MACRO=ULTRA_QUITE_MODE VARIABLE=active VALUE={0 if active else 1}