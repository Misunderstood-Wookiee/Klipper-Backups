# Set the hotend target and wait within one degree of the requested value.
[gcode_macro M109]
rename_existing: M109.1
description: Set and wait for hotend temperature
gcode:
    #Parameters
    {% set s = params.S|float %}

    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}                                              ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}                                               ; Wait for hotend temp (within 1 degree)
    {% endif %}


# Run PID tuning for the selected heater.
[gcode_macro M303]
gcode:
    {% if params.E is defined %}
     {% if params.S is defined %}
        {% if (params.E|int)==-1 %} 
         PID_CALIBRATE HEATER=heater_bed TARGET={params.S|int}
        {% endif %}
        {% if (params.E|int)==0 %}
         PID_CALIBRATE HEATER=extruder TARGET={params.S|int}
        {% endif %}
     {% endif %}
  {% endif %}


# Set the chamber target between 0 and 65 C.
[gcode_macro M141]
description: Set chamber temperature
gcode:
    {% if printer["heater_generic chamber"] is defined %}
        {% set chamber_target_temp = params.S|default(0)|float %}
        {% set chamber_target_temp = [[chamber_target_temp, 65.0]|min, 0.0]|max %}
        SET_HEATER_TEMPERATURE HEATER=chamber TARGET={chamber_target_temp}
    {% endif %}


# Set the chamber target and wait for it to stabilize.
[gcode_macro M191]
description: Set and wait for chamber temperature
gcode:
    {% set chamber_target_temp = params.S|default(0)|float %}
    {% set chamber_target_temp = [[chamber_target_temp, 65.0]|min, 0.0]|max %}

    {% if chamber_target_temp == 0 %}
        M118 Chamber heater off
    {% else %}
        M141 S{chamber_target_temp}
        TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={([chamber_target_temp, 60]|min)-2} MAXIMUM={chamber_target_temp + 5}  
        M118 Chamber at target temperature
    {% endif %}


