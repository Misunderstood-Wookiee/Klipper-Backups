#####################################################################
# Core Klipper macro collection for the Qidi Plus 3 printer
#
# Summary:
#   - Provides custom homing with reduced XY motor current.
#   - Starts and ends prints with thermal, mesh, purge, and cleanup steps.
#   - Adds guarded pause, resume, cancel, filament, fan, and calibration tools.
#   - Monitors chamber temperature and boosts the filter fan when required.
#
# User safety notes:
#   - Keep the motion area clear whenever using homing or calibration macros.
#   - A failed homing operation must be corrected before continuing a print.
#   - FORCE_MOVE bypasses normal kinematic limits and is hardware-dependent.
#   - Confirm temperatures, fan names, probe behavior, and homing order for this
#     printer before using these macros on another machine.
#####################################################################

#####################################################################
# G28 - Home axes with reduced XY current and guarded positioning
#####################################################################
[gcode_macro G28]
rename_existing: G28.1
gcode:
    {% set reduced_current_x = 0.6 %}
    {% set reduced_current_y = 0.7 %}
    {% set home_all = ('X' in rawparams.upper() and 'Y' in rawparams.upper() and 'Z' in rawparams.upper()) or 
                      ('X' not in rawparams.upper() and 'Y' not in rawparams.upper() and 'Z' not in rawparams.upper()) %}
    {% set home_current_x = printer.configfile.settings['tmc2209 stepper_x'].run_current * reduced_current_x %}
    {% set home_current_y = printer.configfile.settings['tmc2209 stepper_y'].run_current * reduced_current_y %}

    {% set init_XY_move = 30 %}
    #{% set y_init_move = 5 %}
    {% set z_clearance = 2 %}

    {% set home_all_final_position_x = printer.toolhead.axis_maximum.x / 2 %}
    {% set home_all_final_position_y = printer.toolhead.axis_maximum.y - 40 %}
    {% set home_all_final_position_z = 10 %}

    # Preserve probe parameters such as METHOD=CONTACT and CALIBRATE=1.
    {% set extra_parts = [] %}
    {% for key in params %}
        {% if key not in ['X', 'Y', 'Z'] %}
            {% set extra_parts = extra_parts + [key ~ '=' ~ params[key]] %}
        {% endif %}
    {% endfor %}
    {% set extra_params = extra_parts|join(' ') %}

    # Move Z away from the bed before homing X or Y.
    {% if home_all or 'X' in rawparams.upper() or 'Y' in rawparams.upper() %}     
        # Use a normal move when Z is known; otherwise use the configured
        # clearance move because normal kinematic positioning is unavailable.
        {% if 'z' in printer.toolhead.homed_axes %}
            {% set Z_axis_was_homed = true %}                                                                  ; Z is already homed
            G91                                                                                                 ; Use relative positioning
            G1 Z2 F600                                                                                          ; Clear the bed before XY homing
            G90                                                                                                 ; Use absolute positioning
        {% else %}
            {% set Z_axis_was_homed = false %}                                                                 ; Z is not homed
            FORCE_MOVE STEPPER=stepper_z DISTANCE={z_clearance} VELOCITY=10                                     ; Clear the bed without homed Z
        {% endif %}
    {% endif %}

    {% if home_all or 'X' in rawparams.upper() or 'Y' in rawparams.upper() %} 
        G91                                                                                                     ; Use relative positioning
        FORCE_MOVE STEPPER=stepper_x DISTANCE={init_XY_move} VELOCITY=40                                        ; Move clear of the XY start position
        SET_KINEMATIC_POSITION X={printer.toolhead.position.x + (init_XY_move/2)}                               ; Account for the forced X move
        SET_KINEMATIC_POSITION Y={printer.toolhead.position.y + (init_XY_move/2)}                               ; Account for the forced XY position
        G90                                                                                                     ; Use absolute positioning
    {% endif %}

    # Home Y first, as required by this printer's configured sequence.
    {% if home_all or 'Y' in rawparams.upper() %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_current_y}                                               ; Reduce XY current for homing
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={home_current_y}                                               ; Reduce XY current for homing
        G28.1 Y                                                                                                  ; Home Y using the original Klipper command
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer.configfile.settings['tmc2209 stepper_x'].run_current} ; Restore configured X current
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer.configfile.settings['tmc2209 stepper_y'].run_current} ; Restore configured Y current
        G1 Y10 F1200                                                                                             ; Move away from the Y endstop
    {% endif %}
    
    # Home X after Y has completed.
    {% if home_all or 'X' in rawparams.upper() %}        
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={home_current_x}                                               ; Reduce XY current for homing
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={home_current_x}                                               ; Reduce XY current for homing
        G28.1 X                                                                                                  ; Home X using the original Klipper command
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer.configfile.settings['tmc2209 stepper_x'].run_current} ; Restore configured X current
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer.configfile.settings['tmc2209 stepper_y'].run_current} ; Restore configured Y current
        G1 X10 F1200                                                                                             ; Move away from the X endstop
    {% endif %}

    # Restore the original Z clearance after XY-only homing.
    {% if not (home_all or 'Z' in rawparams.upper()) %}
        {% if Z_axis_was_homed %}
            G91                                                                                                     ; Use relative positioning
            G1 Z-2 F600                                                                                             ; Raise the bed back again
            G90                                                                                                     ; Use absolute positioning
        {% else %}
            FORCE_MOVE STEPPER=stepper_z DISTANCE=-{z_clearance} VELOCITY=10                                        ; Raise the bed back again
        {% endif %}
    {% endif %}

    # Home Z, optionally forwarding contact-calibration parameters.
    {% if home_all or 'Z' in rawparams.upper() %}
        G28.1 Z {extra_params}                                                                                  ; Home Z and forward contact parameters
        G90                                                                                                         ; Set absolute positioning
        G1 Z{home_all_final_position_z}                                                                         ; Move to the safe post-home Z height
    {% endif %}

    # Park at the rear center only after a complete home request.
    {% if home_all %}
        G90                                                                                                         ; Set absolute positioning
        G1 X{home_all_final_position_x} Y{home_all_final_position_y} Z{home_all_final_position_z} F7800             ; Move to the rear center
    {% endif %}


#####################################################################
# HOME_IF_NEEDED - Home X/Y/Z only when required
#####################################################################
[gcode_macro HOME_IF_NEEDED]
description: Home only axes that are not already homed
gcode:
    {% set axes_to_home = "" %}
    {% if "y" not in printer.toolhead.homed_axes %}
        {% set axes_to_home = axes_to_home ~ "Y" %}
    {% endif %}
    {% if "x" not in printer.toolhead.homed_axes %}
        {% set axes_to_home = axes_to_home ~ "X" %}
    {% endif %}
    {% if "z" not in printer.toolhead.homed_axes %}
        {% set axes_to_home = axes_to_home ~ "Z" %}
    {% endif %}
    {% if axes_to_home|length > 0 %}
        G28 {axes_to_home}                                                                                        ; Home the missing axes
        M400                                                                                                      ; Wait until homing motion is complete
        _HOME_IF_NEEDED_VERIFY AXES={axes_to_home}                                                                ; Stop if any requested axis is still unhomed
    {% endif %}


[gcode_macro _HOME_IF_NEEDED_VERIFY]
gcode:
    {% set requested_axes = params.AXES|default("")|upper %}
    {% set missing_axes = [] %}
    {% for axis in ["X", "Y", "Z"] %}
        {% if axis in requested_axes and axis|lower not in printer.toolhead.homed_axes %}
            {% set missing_axes = missing_axes + [axis] %}
        {% endif %}
    {% endfor %}
    {% if missing_axes|length > 0 %}
        {action_raise_error("Homing stopped: the " ~ missing_axes|join(", ") ~ " axis did not report home. Check for an obstruction or sensor problem, then clear the error and home again.")}
    {% endif %}


# Stop the current operation and enter the configured pause workflow.
[gcode_macro M0]
gcode:
    PAUSE


# Pause an SD-card print using the custom pause workflow.
[gcode_macro M25]
rename_existing: M9925
gcode:
    PAUSE


########################################
# Basic Macros
########################################
# Select STATIC_MESH for the next print when the saved profile is available.
[gcode_macro NEXT_PRINT_STATIC_MESH]
description: Forces the NEXT print to use 'STATIC_MESH' instead of KAMP.
gcode:
    {% if "STATIC_MESH" in printer.bed_mesh.profiles %}
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=force_static_mesh VALUE=True
        {action_respond_info("The NEXT print will use 'STATIC_MESH'.")}
        M118 The NEXT print will use the STATIC_MESH.
    {% else %}
        {action_respond_info("WARNING: No mesh named 'STATIC_MESH' found. Please save one first (BED_MESH_PROFILE SAVE=STATIC_MESH).")}
        M118 WARNING: No mesh named STATIC_MESH found. Please save one first (BED_MESH_PROFILE SAVE=STATIC_MESH).
    {% endif %}


[gcode_macro PRINT_START]
# Slicer entry point: home, heat, soak, mesh, calibrate, and purge.
description: Start a print with the configured preparation sequence
variable_force_static_mesh: False                                                                                   ; Set True to force STATIC_MESH for this print
# Flag used to route the next G29 to STATIC_MESH instead of adaptive meshing.
# Supports both "legacy mode" (standard slicer start gcode) and "advanced mode"
# (recommended slicer start gcode that passes explicit parameters).
variable_static_mesh_on_next_g29: False                                                                             
gcode:
    {% set bed_target_temp = params.BED|default(params.BED_TEMP|default(0))|int %}
    {% set hotend_target_temp = params.HOTEND|default(params.EXTRUDER_TEMP|default(0))|int %}
    {% set chamber_target_temp = params.CHAMBER|default(params.CHAMBER_TEMP|default(0))|int %}
    {% set in_advanced_mode = (params.ADVANCED_MODE|default(0)|int == 1) or (bed_target_temp > 0) or (hotend_target_temp > 0) or (chamber_target_temp > 0) %}
    {% if in_advanced_mode and (bed_target_temp <= 0 or hotend_target_temp <= 0) %}
        {action_raise_error("Print start stopped: valid BED and HOTEND temperatures were not provided. Check the slicer start command and enter values above 0 C, then try again.")}
    {% endif %}
    # Debug helper: log slicer temperatures and the resolved advanced-mode state.
    # {action_respond_info("PRINT_START debug: BED=" ~ bed_target_temp ~ " HOTEND=" ~ hotend_target_temp ~ " CHAMBER=" ~ chamber_target_temp ~ " ADVANCED_MODE=" ~ (params.ADVANCED_MODE|default(0)) ~ " in_advanced_mode=" ~ in_advanced_mode)}

    # Shared setup inputs for bed soak and dynamic pressure advance.
    {% set material = params.MATERIAL|default("PLA")|string %}
    {% set pa = params.PRESSURE_ADVANCE|default(None) %}
    {% set nozzle = params.NOZZLE|default(0.4)|float %}
    {% set force_soak = params.FORCE_SOAK|default("False")|lower == "true" %}
    {% set force_pa = params.FORCE_PA|default("False")|lower == "true" %}
    {% set smooth_time = params.SMOOTH_TIME|default(0.03)|float %}
    {% set start_position_x = printer.toolhead.axis_maximum.x / 2 %}
    {% set start_position_y = printer.toolhead.axis_maximum.y - 40 %}
    {% set start_position_z = 10 %}

    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0																; Disable SFS v2.0 encoder temporarily to prevent false trigger from zero filament movement.
    CLEAR_PAUSE                                                                                                     ; Clear existing pause states
    SKEW_PROFILE LOAD=Default																						; Load [skew_correction] profile (comment-out this line not using [skew_correction] in printer.cfg)
    PRINT_START_LIGHTS																						        ; Optional chamber light start sequence.
    G28                                                                                                             ; Home all axes
        G90                                                                                                         ; Use absolute positioning
        SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=Mainboard_fan TARGET=1                                           ; Keep the mainboard fan active

    {% set KAMP_deactivated = printer["gcode_macro PRINT_START"].force_static_mesh %}                               ; True when STATIC_MESH is forced for this print
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=force_static_mesh VALUE=False                                 ; Reset the selection after reading it
        SET_GCODE_VARIABLE MACRO=PRINT_START VARIABLE=static_mesh_on_next_g29 VALUE={KAMP_deactivated}              ; Pass the selection to legacy G29
    

    # Advanced mode runs full thermal prep + mesh + Z calibration.
    {% if in_advanced_mode %}
        {% set bed_center_x = printer.configfile.config["stepper_x"]["position_max"]|float / 2 %}
        {% set bed_center_y = printer.configfile.config["stepper_y"]["position_max"]|float / 2 %}
        
        M140 S{bed_target_temp}                                                                                      ; Set bed temperature
        M141 S{chamber_target_temp}                                                                                  ; Set chamber temperature
        {% if chamber_target_temp > 0 %}                                                                             ; Use bed heat + airflow assist to warm chamber faster
            G0 X{bed_center_x} Y{bed_center_y} Z3 F780                                                               ; Center bed/nozzle position for better chamber heat distribution
            M106 P2 S185                                                                                             ; Side fan on to circulate warm air
            M106 P0 S128                                                                                             ; Turn part cooling fan on to help air mixing
            TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={chamber_target_temp - 5}                       ; Wait for chamber to heat up
            M106 P2 S0                                                                                               ; Turn off sidefan
            M106 P0 S0                                                                                               ; Turn off part cooling fan                                                                      
        {% endif %}
        
        M190 S{bed_target_temp}                                                                                      ; Set and wait for bed temperature
        BED_SOAK MATERIAL={material} BED_TEMP={bed_target_temp} FORCE_SOAK={force_soak}                              ; Optional soak to thermally stabilize the bed
        
        # Dynamic Pressure Advance (requires dynamic_pressure_advance_module.cfg)
        {% if pa is not none %}
        DYNAMIC_PRESSURE_ADVANCE MATERIAL={material} PRESSURE_ADVANCE={pa} NOZZLE={nozzle} FORCE_PA={force_pa} SMOOTH_TIME={smooth_time}
    {% else %}
        DYNAMIC_PRESSURE_ADVANCE MATERIAL={material} NOZZLE={nozzle} FORCE_PA={force_pa} SMOOTH_TIME={smooth_time}
    {% endif %}
    
        # Beacon coarse contact calibration
        CLEAN_NOZZLE LABEL="pre-Z Offset coarse contact calibration (1/3)"                                         ; Clean the nozzle pass (1/2)
        RESPOND MSG="Beacon: Heating nozzle to 150C for contact calibration"                                       ; BEACON ONLY: Show heating status.
        M109 S150                                                                                                  ; BEACON ONLY: Heat to 150C for coarse contact calibration.
        RESPOND MSG="Beacon: Waiting 30 seconds for nozzle temperature to stabilize"                               ; BEACON ONLY: Show stabilization status.
        G4 P30000                                                                                                  ; BEACON ONLY: Wait 30 seconds for temperature stability.
        RESPOND MSG="Beacon: Running coarse Z-offset calibration"                                                  ; BEACON ONLY: Show pass 1 status.
        M118 Beacon: Coarse Z-offset calibration                                                                   ; BEACON ONLY: Show pass 1 status on the LCD.
        G28.1 Z METHOD=CONTACT CALIBRATE=1                                                                         ; BEACON ONLY: Pass 1, establish the contact model
                                                                            
        {% if KAMP_deactivated %}
        {% if "STATIC_MESH" in printer.bed_mesh.profiles %}                                                        ; Use saved STATIC_MESH when forced
            M118  Loading 'STATIC_MESH' instead of KAMP.
            BED_MESH_PROFILE LOAD=STATIC_MESH
        {% else %}                                                                                                 ; Fallback to adaptive mesh if STATIC_MESH is missing
            M118 ERROR: 'STATIC_MESH' not found! Using fallback: KAMP Adaptive Mesh.
            BED_MESH_CLEAR                                                                                         ; Clear previous adaptive mesh
            M118 Generating Adaptive Surface Mesh...
            BED_MESH_CALIBRATE PROFILE=adaptive ADAPTIVE=1                                                         ; Start adaptive meshing
        {% endif %}
    {% else %}                                                                                                     ; Default: run adaptive mesh path
        BED_MESH_CLEAR                                                                                             ; Clear previous adaptive mesh
        M118 Generating Adaptive Surface Mesh...
        BED_MESH_CALIBRATE PROFILE=adaptive ADAPTIVE=1                                                             ; Start adaptive meshing
    {% endif %}
    
        # Final print-temperature wait (shared)
        RESPOND MSG="Heating nozzle to print temperature"                                                          ; Show final heating status.
        M109 S{hotend_target_temp}                                                                                 ; Set and wait for hotend print temperature in case it was not already.
        
        CLEAN_NOZZLE LABEL="pre-Final hotend print-temperature heat-up (2/3)"                                      ; Clean the nozzle pass (2/2)
        # Beacon fine contact calibration
        RESPOND MSG="Beacon: Running fine Z-offset calibration"                                                    ; BEACON ONLY: Show pass 2 status.
        G28.1 Z METHOD=CONTACT CALIBRATE=0                                                                         ; BEACON ONLY: Pass 2, measure the final Z offset at print temperature.
    {% endif %}
    
    G1 X{start_position_x} Y{start_position_y} Z{start_position_z} F7800                                           ; Move to print start position
    LINE_PURGE                                                                                                     ; Prime nozzle/melt zone before printing
    
    # Enable the SFS v2.0 Smart Runout Sensors
    SET_FILAMENT_SENSOR SENSOR=filament ENABLE=1
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1

[gcode_macro PRINT_END]
description: Safely finish a print and shut down heaters
gcode:
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    {% set axes_homed = "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes and "z" in printer.toolhead.homed_axes %}
    {% set current_extruder_temp = printer.extruder.temperature|float %}
    {% set min_extrusion_temp = printer.configfile.config["extruder"]["min_extrude_temp"]|float %}
    {% set z_clearance = 50 %}

    {% if (printer.toolhead.position.z + z_clearance) < max_z %}
        {% set z_hop = 2  %}
    {% else %}
        {% set z_hop = 0 %}
    {% endif %}

    M106 P0 S0                                                                                                      ; Turn off part cooling fan
    M106 P2 S0                                                                                                      ; Turn off side fan
    M106 P3 S0                                                                                                      ; Turn off activated charcoal fan

    M104 S0                                                                                                         ; Turn off the hotend before cancel cleanup
    M140 S0                                                                                                         ; Turn off the heated bed before cancel cleanup
    M141 S0                                                                                                         ; Turn off the heated chamber before cancel cleanup

    {% if axes_homed %}
        G91                                                                                                         ; Relative positioning
        M83                                                                                                         ; Relative extruder positioning
        {% if current_extruder_temp >= min_extrusion_temp + 5 %}                                                    ; Check if the hotend is hot enough to perform a retraction (with a small gap)
            G0 E-4.0 F300                                                                                           ; Retract filament
        {% endif %}
        G0 Z{z_hop} F3600                                                                                           ; Move bed down a bit
        G90                                                                                                         ; Absolute positioning
        G0 X{max_x/2} Y{max_y-40} F20000                                                                            ; Move nozzle to remove stringing
        _Z_CLEARANCE DISTANCE={z_clearance}                                                                         ; Lower bed
        M400                                                                                                        ; Wait for buffer to clear
        G92 E0                                                                                                      ; Zero the extruder
    {% else %}
        RESPOND MSG="PRINT_END: Homing state unavailable; skipping toolhead parking."
    {% endif %}

    M220 S100                                                                                                       ; Set feedrate (speed percentage) back to 100%
    M221 S100                                                                                                       ; Set flow percentage back to 100%

    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}                                     ; Set timeout back to configured value
    CLEAR_PAUSE                                                                                                     ; Ensure pause state is cleared if applicable
    SET_SKEW CLEAR=1																								; Clear [skew_correction] profile (comment-out this line not using [skew_correction] in printer.cfg)

    M84                                                                                                             ; Disable steppers
    SET_TEMPERATURE_FAN_TARGET TEMPERATURE_FAN=Mainboard_fan TARGET=45                                              ; Reset the mainboard fan temp
    BEEP I=2 DUR=500                                                                                                ; Alert at the end of the print (if sound is enabled)
    
    # Disable the SFS v2.0 Smart Runout Sensors
    SET_FILAMENT_SENSOR SENSOR=filament ENABLE=0
    SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    
    PRINT_DONE_CELEBRATION                                                                                          ; Chamber Light Sequence for Print End (only if using caselight_effects_sequences_module.cfg)

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
description: Pause the print, park the toolhead, and cool the hotend
gcode:
    {% set z_hop = params.Z|default(30)|float %}                                                                   ; Z hop amount
    {% set z_hop = [z_hop, 0.0]|max %}                                                                             ; Prevent negative Z hop input
    {% set pause_state = printer['pause_resume'].is_paused|int %}

    {% if pause_state == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z_hop}                                                ; Set Z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}                          ; Set hotend temperature variable for reference in resume macro
        SAVE_GCODE_STATE NAME=PAUSE                                                                                ; Save current position for resume
        BASE_PAUSE                                                                                                 ; Pause print
        M400                                                                                                       ; Flush queued moves before parking
        {% if (printer.gcode_move.position.z + z_hop) < printer.toolhead.axis_maximum.z %}                         ; Check that Z hop doesn't exceed Z max
            G91                                                                                                    ; Use Relative positioning
            G1 Z{z_hop} F600                                                                                       ; Raise Z up by Z hop amount
        {% else %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0                                                  ; Set Z hop to 0 if exceeds max
        {% endif %}
        SAVE_GCODE_STATE NAME=PAUSEPARK2
        G90                                                                                                        ; Absolute positioning
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y-40} F6000                        ; Park toolhead  at rear center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                                            ; Save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        M104 S0                                                                                                    ; Turn off the hotend while paused
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                                             ; Set timeout to 12 hours
        SET_STEPPER_ENABLE STEPPER=extruder enable=0                                                               ; Release the extruder motor while paused
        M400                                                                                                       ; Ensure parking moves are complete before returning
        
        # Disable the SFS v2.0 Smart Runout Sensors
        SET_FILAMENT_SENSOR SENSOR=filament ENABLE=0
        SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=0
    {% else %}
        RESPOND MSG="PAUSE: Print already paused"                                                                  ; Avoid re-running the pause sequence twice
    {% endif %}


[gcode_macro RESUME]
rename_existing: BASE_RESUME
description: Safely restore the paused position and resume printing
variable_zhop: 0
variable_etemp: 0
gcode:
    {% set extrusion_length = params.E|default(2.5)|float %}                                                       ; Hotend prime amount (in mm)
    {% set extrusion_length = [extrusion_length, 0.0]|max %}                                                       ; Prevent negative prime input
    {% set pause_state = printer['pause_resume'].is_paused|int %}

    {% if pause_state == 1 %}
        {% if "z" not in printer.toolhead.homed_axes %}                                                            ; check if z position is lost
            {action_raise_error("Resume stopped: Z homing was lost, so the saved height is unknown. Abort the print, check the machine, and home Z before starting again.")}
        {% endif %}

        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}                                ; Set idle timeout back to configured value
        M400                                                                                                       ; Flush queued moves before restoring state

        {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
            {action_raise_error("Resume stopped: X or Y homing was lost, so the saved position is unknown. Abort the print, check the machine, and home X and Y before starting again.")}
        {% endif %}

        {% if etemp > 0 %}
            M109 S{etemp|int}                                                                                       ; Wait for hotend to heat up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=150                                                    ; Restore back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        M400                                                                                                        ; Wait for the restore move to finish before continuing
        G91                                                                                                         ; Relative positioning
        M83                                                                                                         ; Relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp and extrusion_length > 0 %}
            G1 E{extrusion_length} F900                                                                              ; Prime nozzle
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK2 MOVE=1 MOVE_SPEED=150
        M400                                                                                                        ; Flush queued moves before final restore
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=10                                                         ; Restore position
        M400                                                                                                        ; Ensure the final state restore is complete before resuming
        BASE_RESUME                                                                                                 ; Resume print
        G90                                                                                                         ; Absolute positioning
        
        # Enable the SFS v2.0 Smart Runout Sensors
        SET_FILAMENT_SENSOR SENSOR=filament ENABLE=1
        SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE=1
    {% else %}
        RESPOND MSG="RESUME: Print not paused"                                                                      ; Avoid re-running the resume sequence twice
    {% endif %}


[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
description: Stop the print and shut down heaters safely
gcode:
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    {% set print_state = printer.print_stats.state|string|lower %}
    {% set pause_state = printer['pause_resume'].is_paused|int %}
    {% set can_park = "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes and "z" in printer.toolhead.homed_axes %}

    {% if print_state not in ["printing", "paused"] and pause_state == 0 %}
        RESPOND MSG="CANCEL_PRINT: No active print to cancel"                                                       ; Avoid running the cancel sequence for a non-active job
        BASE_CANCEL_PRINT
    {% else %}
        {% if (printer.toolhead.position.z + 2) < max_z %}
            {% set z_hop = 2  %}
        {% else %}
            {% set z_hop = 0 %}
        {% endif %}

        M104 S0                                                                                                     ; Turn off hotend before any cancel motion
        M140 S0                                                                                                     ; Turn off heated bed before any cancel motion
        M141 S0                                                                                                     ; Turn off heated chamber before any cancel motion
        {% if can_park %}
            M400                                                                                                    ; Flush queued moves before cancel cleanup
            G91                                                                                                     ; Relative positioning
            G1 Z{z_hop} F600                                                                                        ; Do a tiny z-hop
            G90                                                                                                     ; Absolute positioning

            G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y-40} F12000
            M400                                                                                                    ; Wait for the parking move to finish
        {% else %}
            RESPOND MSG="CANCEL_PRINT: Homing state unavailable; skipping toolhead parking."
        {% endif %}
        CLEAR_PAUSE                                                                                                 ; Clear pause state before shutdown

        PRINT_END
        M400                                                                                                        ; Ensure shutdown moves are complete before canceling
        BASE_CANCEL_PRINT
    {% endif %}


[gcode_macro _Z_CLEARANCE]
description: Lower the bed to create safe toolhead clearance
# Parameters:
#   DISTANCE=<float>  (optional) Relative distance in mm to move the bed DOWN from the current Z position.
#   MIN_Z=<float>     (optional) Absolute minimum Z height that must be reached, regardless of DISTANCE.
# Real-world usage in this config:
#   _Z_CLEARANCE DISTANCE=50           -> Used in PRINT_END to lower the bed 50 mm from wherever it stopped
#   _Z_CLEARANCE DISTANCE=0 MIN_Z=40   -> Ensures at least 40 mm clearance for safe XY travel, eg. before moving to the poop bucket
variable_default_distance: 40.0
gcode:
    {% set current_z_height = printer.toolhead.position.z %}
    {% set max_z_height = printer.toolhead.axis_maximum.z %}
    {% set distance = params.DISTANCE|default(variable_default_distance)|float %}
    {% set target_z_height = current_z_height + distance %}

    {% set min_z_param = params.MIN_Z|default(None) %}
    {% if min_z_param is not none %}
        {% set min_z = min_z_param|float %}
        {% if target_z_height < min_z %}
            {% set target_z_height = min_z %}
        {% endif %}
    {% endif %}

    G90                                                                                                            ; Absolute positioning
    G1 Z{ [target_z_height, max_z_height]|min }                                                                    ; Move only within the configured Z maximum


########################################
#  Filament Macros
########################################
[gcode_macro UNLOAD_FILAMENT]
description: Heat the nozzle, unload filament, and turn the hotend off
gcode:
    {% set EXTRUDER_TEMP = params.TEMP|default(230)|int %}
    {% set CURRENT_TEMP = printer.extruder.temperature|int %}
    {% set PUSH_LEN = params.PUSH_LEN|default(5.0)|float %}
    {% set BREAK_RETRACT_LEN = params.BREAK_RETRACT_LEN|default(2.0)|float %}
    {% set UNLOAD_LEN = params.UNLOAD_LEN|default(50.0)|float %}
    {% set PUSH_SPEED = params.PUSH_SPEED|default(120)|int %}
    {% set BREAK_RETRACT_SPEED = params.BREAK_RETRACT_SPEED|default(240)|int %}
    {% set UNLOAD_SPEED = params.UNLOAD_SPEED|default(180)|int %}
    {% set PUSH_LEN = [PUSH_LEN, 0.0]|max %}
    {% set BREAK_RETRACT_LEN = [BREAK_RETRACT_LEN, 0.0]|max %}
    {% set UNLOAD_LEN = [UNLOAD_LEN, 0.0]|max %}
    {% if PUSH_SPEED <= 0 or BREAK_RETRACT_SPEED <= 0 or UNLOAD_SPEED <= 0 %}
        {action_raise_error("Filament unload stopped: one or more feed rates is zero or negative. Use positive PUSH_SPEED, BREAK_RETRACT_SPEED, and UNLOAD_SPEED values, then try again.")}
    {% endif %}
    {% if CURRENT_TEMP < EXTRUDER_TEMP %}
           M109 S{EXTRUDER_TEMP}                                                                                     ; Heat the hotend to the requested temperature
    {% endif %}
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1                                                                     ; enable extruder stepper
    M83                                                                                                              ; set extruder to relative mode
    G1 E{PUSH_LEN} F{PUSH_SPEED}                                                                                     ; soften filament tip before pulling
    G1 E-{BREAK_RETRACT_LEN} F{BREAK_RETRACT_SPEED}                                                                  ; relieve nozzle pressure
    G4 P300                                                                                                          ; short pause to reduce stick-slip
    G1 E-{UNLOAD_LEN} F{UNLOAD_SPEED}                                                                                ; controlled long retract to unload
    M400                                                                                                             ; wait for moves to finish
    M104 S0                                                                                                     	 ; Turn off the hotend after unloading
    M118 Unload Complete!                                                                                            ; Confirm completion in the console
    NOTIFICATION_SUBTLE                                                                                              ; Show the completion notification


[gcode_macro LOAD_FILAMENT]
description: Heat the nozzle, load filament, and turn the hotend off
gcode:
    {% set EXTRUDER_TEMP = params.TEMP|default(230)|int %}
    {% set CURRENT_TEMP = printer.extruder.temperature|int %}
    {% set FAST_LOAD_LEN = params.FAST_LOAD_LEN|default(45.0)|float %}
    {% set SLOW_LOAD_LEN = params.SLOW_LOAD_LEN|default(25.0)|float %}
    {% set PRIME_LEN = params.PRIME_LEN|default(8.0)|float %}
    {% set FAST_SPEED = params.FAST_SPEED|default(300)|int %}
    {% set SLOW_SPEED = params.SLOW_SPEED|default(120)|int %}
    {% set PRIME_SPEED = params.PRIME_SPEED|default(90)|int %}
    {% set FAST_LOAD_LEN = [FAST_LOAD_LEN, 0.0]|max %}
    {% set SLOW_LOAD_LEN = [SLOW_LOAD_LEN, 0.0]|max %}
    {% set PRIME_LEN = [PRIME_LEN, 0.0]|max %}
    {% if FAST_SPEED <= 0 or SLOW_SPEED <= 0 or PRIME_SPEED <= 0 %}
        {action_raise_error("Filament load stopped: one or more feed rates is zero or negative. Use positive FAST_SPEED, SLOW_SPEED, and PRIME_SPEED values, then try again.")}
    {% endif %}
    {% if CURRENT_TEMP < EXTRUDER_TEMP %}
           M109 S{EXTRUDER_TEMP}                                                                                   ; Heat the hotend to the requested temperature
    {% endif %}
        SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1                                                               ; Enable the extruder stepper
        M83                                                                                                        ; Use relative extruder positioning
        G1 E{FAST_LOAD_LEN} F{FAST_SPEED}                                                                          ; Move filament through the cooler path
        G1 E{SLOW_LOAD_LEN} F{SLOW_SPEED}                                                                          ; Slow down near the melt zone
        G4 P300                                                                                                    ; Pause briefly at the nozzle entrance
        G1 E{PRIME_LEN} F{PRIME_SPEED}                                                                             ; Prime the nozzle gently
        M400                                                                                                       ; Wait for moves to finish
        M104 S0                                                                                                    ; Turn off the hotend after loading
        M118 Load Complete!                                                                                        ; Confirm completion in the console
        NOTIFICATION_SUBTLE                                                                                        ; Show the completion notification


# Enable or disable both configured filament runout sensors.
[gcode_macro M8029]
description: Enable/disable filament runout sensors. Usage: M8029 D=1 (enable) / M8029 D=0 (disable)
gcode:
    {% set state = params.D|default(-1)|int %}
    {% if state == 0 or state == 1 %}
        SET_FILAMENT_SENSOR SENSOR=filament ENABLE={state}
        SET_FILAMENT_SENSOR SENSOR=encoder_sensor ENABLE={state}
    {% else %}
        RESPOND MSG="M8029: D parameter must be 0 or 1"
    {% endif %}


########################################
# Fan Macros
########################################
# Set Fan Speed macro
# Mainly name castings for nicer web interface names and display functionality
[gcode_macro M106]
rename_existing: M106.1
description: Set the requested part, side, or filtration fan speed
gcode:
    {% if params.P is defined %}
      {% if params.S is defined %}
        {% set speed = 0.003921*params.S|int %}
        {% if (params.P|int) == 0 %}
          M106.1 S{params.S|int}
        {% elif (params.P|int) == 2 %}
          SET_FAN_SPEED FAN=sidefan SPEED={speed}
        {% elif (params.P|int) == 3 %}
          SET_FAN_SPEED FAN=filterfan SPEED={speed}
        {% else %}
          SET_FAN_SPEED FAN=fan{params.P|int} SPEED={speed}
        {% endif %}
      {% else %}
        {% if (params.P|int) == 0 %}
          M106.1 S255
        {% elif (params.P|int) == 2 %}
          SET_FAN_SPEED FAN=sidefan SPEED=1
        {% elif (params.P|int) == 3 %}
          SET_FAN_SPEED FAN=filterfan SPEED=1
        {% else %}
          SET_FAN_SPEED FAN=fan{params.P|int} SPEED=1
        {% endif %}
      {% endif %}
    {% endif %} 

    {% if params.T is defined %}
      {% if (params.T|int) == -2 %}
        {% if params.S is defined %}
          {% set speed = 0.003921*params.S|int %}
          SET_FAN_SPEED FAN=filterfan SPEED={speed}
        {% else %}
          SET_FAN_SPEED FAN=filterfan SPEED=1
        {% endif %}
      {% endif %}
    {% endif %}

    {% if params.P is undefined %}
      {% if params.T is undefined %}
        {% if params.S is defined %}
          M106.1 S{params.S|int}
        {% else %}
          M106.1 S255
        {% endif %}
      {% endif %}
    {% endif %}

[gcode_macro M107]
rename_existing: M107.1
gcode:  
    M106.1 S0


